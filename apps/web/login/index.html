<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Materna</title>
    <link rel="stylesheet" href="/demo-style.css" />
  </head>
  <body>
    <main class="page auth-page">
      <section class="auth-card">
        <a class="brand auth-brand" href="/demo">
          <img class="brand-logo-img small" src="/materna-app-icon.png" alt="Materna logo" />
          <span>
            <span class="hack-brand-title">MATERNA</span>
            <span class="hack-brand-subtitle">Real app sign-in path</span>
          </span>
        </a>
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-copy">Authentication exists for registered users. Recruiters can use the demo path without creating an account.</p>
        <form class="auth-form">
          <label>Email</label>
          <input type="email" placeholder="patient@example.com" />
          <label>Password</label>
          <input type="password" placeholder="••••••••" />
          <button type="button">Sign in</button>
        </form>
        <div class="auth-note">
          <strong>Reviewing Materna?</strong>
          <a href="/demo/explore">Try the no-account live demo →</a>
        </div>
      </section>
    </main>
  </body>
</html>
